<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="" />
    <meta name="description" content="Leilões de cartas colecionáveis Pokémon em tempo real." />
    <title>PokéLance — Leilões em tempo real</title>
    <script>
      const savedTheme = localStorage.getItem("pokemon-auction-theme");
      const preferredTheme = savedTheme === "light" || savedTheme === "dark"
        ? savedTheme
        : "light";
      document.documentElement.dataset.theme = preferredTheme;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
