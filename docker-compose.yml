services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: pokemon_auction
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d pokemon_auction"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: build
    command: npm run db:deploy
    environment:
      DATABASE_URL: postgresql://auction:auction@postgres:5432/pokemon_auction?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      target: build
    command: npm run db:seed
    environment:
      DATABASE_URL: postgresql://auction:auction@postgres:5432/pokemon_auction?schema=public
      UPLOADS_DIR: ./uploads
    volumes:
      - auction_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://auction:auction@postgres:5432/pokemon_auction?schema=public
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no ficheiro .env}
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      UPLOADS_DIR: ./uploads
    ports:
      - "4000:4000"
    volumes:
      - auction_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  postgres_data:
  auction_uploads:
